project:
  name: ecommerce-revenue-intelligence
  currency: GBP

dataset:
  slug: mathchi/online-retail-ii-data-set-from-ml-repository
  raw_filename: online_retail_II.xlsx
  checksum_filename: checksums.json
  sheets:
    - Year 2009-2010
    - Year 2010-2011

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  marts: data/processed/marts
  quarantine: data/quarantine
  warehouse: data/warehouse.sqlite
  excel_audit: excel/data_audit.xlsx
  sql: sql
  logs: logs

cleaning:
  min_unit_price: 0.0
  cancellation_prefix: C
  duplicate_key:
    - invoice_no
    - stock_code
    - quantity
    - invoice_ts
    - unit_price
  net_revenue_line_types: [product, shipping]
  shipping_codes: [POST, DOT, C2]
  adjustment_codes: [M, D, B, CRUK, BANK CHARGES, AMAZONFEE, ADJUST, ADJUST2]
  test_codes: [S, TEST001, TEST002]
  country_overrides:
    EIRE: Ireland
    RSA: South Africa
    Korea: South Korea
  union_cache_filename: raw_union.parquet
  transactions_filename: transactions.parquet
  quarantine_filename: quarantined_rows.parquet
  dq_report_filename: dq_report.json

warehouse:
  min_sqlite_version: "3.25"
  unknown_customer_key: -1

logging:
  level: INFO
  format: "%(asctime)s %(levelname)-7s %(name)s | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
